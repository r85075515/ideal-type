name: Ideal Type & Fulfillment Worker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run static site & security verification
        run: python3 tools/verify_site.py
      - name: Run Cloudflare Worker offline unit tests (Stripe HMAC, dedupe, signed R2)
        run: node --test worker/tests/test_worker.mjs
